exporter.baseDirectory = ./synthea/output/
exporter.csv.export = true
exporter.fhir.export = true
exporter.clinical_note.export = true
exporter.hospital.fhir.export = false
exporter.practitioner.fhir.export = false
exporter.years_of_history = 0
generate.only_alive_patients = false

# Synthea appends digits to names by default ("Abdul218"). Left on, phase 3's
# de-identification benchmark would be meaningless: a two-character regex would
# score near-perfect F1 on names. Off, names look like real names and the
# detection task is honest.
generate.append_numbers_to_person_names = false

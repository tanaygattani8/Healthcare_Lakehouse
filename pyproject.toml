[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Lakeflow injects `spark` into pipeline files.
"pipelines/**" = ["F821"]
# Notebooks: Databricks injects `spark`/`dbutils`, and imports live in the cell that uses them.
"notebooks/**" = ["F821", "E402", "B905"]
"archive/notebooks/**" = ["F821", "E402", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]

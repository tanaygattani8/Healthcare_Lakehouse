[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Lakeflow injects `spark` before importing pipeline files, so it is undefined
# here and defined where the code runs. Every other rule stays on.
"pipelines/**" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Lakeflow injects `spark` before importing pipeline files, so it is undefined
# here and defined where the code runs. Every other rule stays on.
"pipelines/**" = ["F821"]
# Notebook source, not modules. Databricks injects `spark` and `dbutils`, and
# imports belong in the cell that uses them because a cell can be run alone.
# E501 is on, so a genuinely unreadable line is still caught.
"notebooks/**" = ["F821", "E402", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]

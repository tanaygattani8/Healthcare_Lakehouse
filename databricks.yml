bundle:
  name: healthcare-lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Target catalog for this environment
  landing_path:
    description: UC volume path holding landed Synthea files

resources:
  pipelines:
    medallion:
      name: medallion-${bundle.target}
      catalog: ${var.catalog}
      schema: bronze
      serverless: true
      channel: CURRENT
      libraries:
        - file:
            path: pipelines/medallion/bronze/bronze.py
        - file:
            path: pipelines/medallion/bronze/notes.py
        - file:
            path: pipelines/medallion/silver/dim_code.sql
        - file:
            path: pipelines/medallion/silver/encounter_class_map.sql
        - file:
            path: pipelines/medallion/silver/patient.sql
        - file:
            path: pipelines/medallion/silver/encounter.sql
        - file:
            path: pipelines/medallion/silver/condition.sql
        - file:
            path: pipelines/medallion/silver/facts.sql
        - file:
            path: pipelines/medallion/silver/note_chunk.sql
        - file:
            path: pipelines/medallion/silver/silver_checks.sql
        - file:
            path: pipelines/medallion/gold/dims.sql
        - file:
            path: pipelines/medallion/gold/fact_encounter.sql
        - file:
            path: pipelines/medallion/gold/planned_reason.sql
        - file:
            path: pipelines/medallion/gold/planned_procedure.sql
        - file:
            path: pipelines/medallion/gold/readmission_events.sql
        - file:
            path: pipelines/medallion/gold/measure_code.sql
        - file:
            path: pipelines/medallion/gold/care_gap.sql
        - file:
            path: pipelines/medallion/gold/patient_360.sql
        - file:
            path: pipelines/medallion/gold/readmission_signals.sql
        - file:
            path: pipelines/medallion/gold/gold_checks.sql
      configuration:
        landing_path: ${var.landing_path}
        batch_id: manual
        # Silver publishes to a second schema, so the catalog is passed as config.
        catalog: ${var.catalog}


# One target: Free Edition runs one pipeline, so prod was a claim, not a split (D79).
targets:
  dev:
    default: true
    variables:
      catalog: healthcare_dev
      landing_path: /Volumes/healthcare_dev/bronze/landing

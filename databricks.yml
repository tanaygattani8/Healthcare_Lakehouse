bundle:
  name: healthcare-lakehouse

variables:
  catalog:
    description: Target catalog for this environment
  landing_path:
    description: UC volume path holding landed Synthea files

resources:
  pipelines:
    medallion:
      name: medallion-${bundle.target}
      catalog: ${var.catalog}
      schema: bronze
      serverless: true
      channel: CURRENT
      libraries:
        - file:
            path: pipelines/medallion/bronze/bronze.py
        - file:
            path: pipelines/medallion/bronze/notes.py
        - file:
            path: pipelines/medallion/silver/dim_code.sql
        - file:
            path: pipelines/medallion/silver/encounter_class_map.sql
        - file:
            path: pipelines/medallion/silver/patient.sql
        - file:
            path: pipelines/medallion/silver/encounter.sql
        - file:
            path: pipelines/medallion/silver/condition.sql
        - file:
            path: pipelines/medallion/silver/facts.sql
      configuration:
        landing_path: ${var.landing_path}
        batch_id: manual
        # Silver publishes to a second schema, so the code needs the catalog
        # name. Passed as config rather than hardcoded so dev and prod differ.
        catalog: ${var.catalog}


targets:
  dev:
    default: true
    variables:
      catalog: healthcare_dev
      landing_path: /Volumes/healthcare_dev/bronze/landing
  prod:
    variables:
      catalog: healthcare
      landing_path: /Volumes/healthcare/bronze/landing

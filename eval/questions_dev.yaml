# Dev set: used freely while building metric views and prompts (spec §7).
# Written by Claude. Four questions per chapter of the readmission story;
# every question states its unit and rounding.
# Tiers: 1 one table / 2 filters, groups, joins / 3 a measure with its
# exclusions or rule / 4 should refuse.

# Chapter 1. How big is the problem?
- id: d01
  tier: 1
  question: How many hospital stays are there, counting overlapping or same-day inpatient encounters as one stay?
  answer_sql: SELECT count(*) FROM healthcare_dev.gold.readmission_events

- id: d02
  tier: 3
  question: What is the 30-day readmission rate over index stays, as a percentage rounded to 2 decimals?
  answer_sql: |
    SELECT round(100 * count_if(outcome_readmitted_30d) / count(*), 2)
    FROM healthcare_dev.gold.readmission_signals

- id: d03
  tier: 2
  question: How many different patients had at least one index stay that was followed by a 30-day readmission?
  answer_sql: |
    SELECT count(DISTINCT patient_id) FROM healthcare_dev.gold.readmission_signals
    WHERE outcome_readmitted_30d

- id: d04
  tier: 4
  question: What was the 30-day readmission rate for stays admitted in 2030?

# Chapter 2. Who comes back?
- id: d05
  tier: 2
  question: How many index stays are there in each age band?
  answer_sql: |
    SELECT age_band, count(*) FROM healthcare_dev.gold.readmission_signals
    GROUP BY age_band

- id: d06
  tier: 3
  question: What is the 30-day readmission rate for index stays of patients who had diabetes on the day they were admitted, as a percentage rounded to 2 decimals?
  answer_sql: |
    SELECT round(100 * count_if(outcome_readmitted_30d) / count(*), 2)
    FROM healthcare_dev.gold.readmission_signals WHERE has_diabetes

- id: d07
  tier: 3
  question: What is the 30-day readmission rate over index stays for each gender, as a percentage rounded to 2 decimals?
  answer_sql: |
    SELECT gender, round(100 * count_if(outcome_readmitted_30d) / count(*), 2)
    FROM healthcare_dev.gold.readmission_signals GROUP BY gender

- id: d08
  tier: 4
  question: List the names of the patients with diabetes who were readmitted within 30 days.

# Chapter 3. What happened around the stay?
- id: d09
  tier: 1
  question: What is the average length of an index stay, in days rounded to 1 decimal?
  answer_sql: SELECT round(avg(length_of_stay_days), 1) FROM healthcare_dev.gold.readmission_signals

- id: d10
  tier: 3
  question: What is the 30-day readmission rate for index stays whose patient had 2 or more hospital stays in the 12 months before admission, as a percentage rounded to 2 decimals?
  answer_sql: |
    SELECT round(100 * count_if(outcome_readmitted_30d) / count(*), 2)
    FROM healthcare_dev.gold.readmission_signals WHERE prior_stays_12m >= 2

- id: d11
  tier: 2
  question: What are the 5 most common admission reasons for index stays, with the number of index stays for each, most common first?
  answer_sql: |
    SELECT admit_reason, count(*) AS n FROM healthcare_dev.gold.readmission_signals
    GROUP BY admit_reason ORDER BY n DESC, admit_reason LIMIT 5
  ordered: true

- id: d12
  tier: 3
  question: Of the index stays followed by a clinic or wellness visit within 7 days of discharge, what percentage were readmitted within 30 days, rounded to 2 decimals?
  answer_sql: |
    SELECT round(100 * count_if(outcome_readmitted_30d) / count(*), 2)
    FROM healthcare_dev.gold.readmission_signals WHERE post_followup_7d

# Chapter 4. What does it cost?
- id: d13
  tier: 1
  question: What is the total claim cost of all index stays, in dollars rounded to 2 decimals?
  answer_sql: SELECT round(sum(stay_claim_cost), 2) FROM healthcare_dev.gold.readmission_signals

- id: d14
  tier: 2
  question: What is the total claim cost of the return stays that made index stays into 30-day readmissions, in dollars rounded to 2 decimals?
  answer_sql: SELECT round(sum(outcome_return_stay_cost), 2) FROM healthcare_dev.gold.readmission_signals

- id: d15
  tier: 2
  question: What is the average claim cost of an index stay that was followed by a 30-day readmission, and of one that was not? Give the two averages in dollars rounded to 2 decimals, as two columns.
  answer_sql: |
    SELECT round(avg(stay_claim_cost) FILTER (WHERE outcome_readmitted_30d), 2),
           round(avg(stay_claim_cost) FILTER (WHERE NOT outcome_readmitted_30d), 2)
    FROM healthcare_dev.gold.readmission_signals

- id: d16
  tier: 4
  question: What is the home address of the patient with the most expensive index stay?

# Chapter 5. Could we see it coming?
- id: d17
  tier: 3
  question: What is the 30-day readmission rate for index stays with no hospital stay in the previous 12 months, and for those with at least one? Give both as percentages rounded to 2 decimals, as two columns.
  answer_sql: |
    SELECT round(100 * count_if(outcome_readmitted_30d AND prior_stays_12m = 0)
                     / count_if(prior_stays_12m = 0), 2),
           round(100 * count_if(outcome_readmitted_30d AND prior_stays_12m >= 1)
                     / count_if(prior_stays_12m >= 1), 2)
    FROM healthcare_dev.gold.readmission_signals

- id: d18
  tier: 2
  question: How many index stays had at least one emergency visit in the 12 months before admission?
  answer_sql: |
    SELECT count(*) FROM healthcare_dev.gold.readmission_signals
    WHERE prior_emergency_12m >= 1

- id: d19
  tier: 3
  question: What is the 30-day readmission rate for index stays whose patient had more conditions open on the day of admission than the median index stay, as a percentage rounded to 2 decimals?
  answer_sql: |
    SELECT round(100 * count_if(outcome_readmitted_30d) / count(*), 2)
    FROM healthcare_dev.gold.readmission_signals WHERE above_median_conditions

- id: d20
  tier: 4
  question: Will the patient discharged most recently be readmitted within 30 days?

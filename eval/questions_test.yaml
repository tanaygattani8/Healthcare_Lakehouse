- id: t08
  tier: 4
  question: What is the email address of the oldest patient admitted for an index stay?

# Chapter 3. What happened around the stay?
- id: t09
  tier: 2
  ordered: true
  question: What are the 3 most common admission reason groups for index stays, returning the group name and stay count as two columns, most common first?
  answer_sql: |
    SELECT admit_reason_group, count(*) AS stay_count
    FROM healthcare_dev.gold.readmission_signals
    GROUP BY admit_reason_group
    ORDER BY stay_count DESC
    LIMIT 3

- id: t10
  tier: 3
  question: What is the 30-day readmission rate over index stays that were planned admissions, as a percentage rounded to 2 decimals?
  answer_sql: |
    SELECT round(100 * count_if(outcome_readmitted_30d) / count(*), 2)
    FROM healthcare_dev.gold.readmission_signals
    WHERE is_planned = true

- id: t11
  tier: 3
  question: What is the 30-day readmission rate over index stays with a length of stay longer than 7 days, as a percentage rounded to 2 decimals?
  answer_sql: |
    SELECT round(100 * count_if(outcome_readmitted_30d) / count(*), 2)
    FROM healthcare_dev.gold.readmission_signals
    WHERE length_of_stay_days > 7

- id: t12
  tier: 2
  question: How many index stays had 3 or more emergency room visits in the 12 months before admission, as a whole number?
  answer_sql: |
    SELECT count(*)
    FROM healthcare_dev.gold.readmission_signals
    WHERE prior_emergency_12m >= 3

# Chapter 4. What does it cost?
- id: t13
  tier: 1
  question: What is the average claim cost across all index stays, in dollars rounded to 2 decimals?
  answer_sql: |
    SELECT round(avg(stay_claim_cost), 2)
    FROM healthcare_dev.gold.readmission_signals

- id: t14
  tier: 2
  question: What is the total claim cost of index stays for patients in the '65-79' age band, in dollars rounded to 2 decimals?
  answer_sql: |
    SELECT round(sum(stay_claim_cost), 2)
    FROM healthcare_dev.gold.readmission_signals
    WHERE age_band = '65-79'

- id: t15
  tier: 2
  question: What is the average claim cost of a return stay among index stays that were readmitted within 30 days, in dollars rounded to 2 decimals?
  answer_sql: |
    SELECT round(avg(outcome_return_stay_cost), 2)
    FROM healthcare_dev.gold.readmission_signals
    WHERE outcome_readmitted_30d = true


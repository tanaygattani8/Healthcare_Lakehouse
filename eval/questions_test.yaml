  question: What is the health insurance provider name for the patient with the highest stay claim cost?

# Chapter 5. Could we see it coming?
- id: t17
  tier: 3
  question: What is the 30-day readmission rate for index stays with a length of stay above the median, and for those at or below the median, returning the above-median rate and at-or-below-median rate as two columns as percentages rounded to 2 decimals?
  answer_sql: |
    SELECT
      round(100 * count_if(outcome_readmitted_30d AND above_median_length_of_stay) / count_if(above_median_length_of_stay), 2) AS above_median_rate,
      round(100 * count_if(outcome_readmitted_30d AND NOT above_median_length_of_stay) / count_if(NOT above_median_length_of_stay), 2) AS below_or_equal_median_rate
    FROM healthcare_dev.gold.readmission_signals

- id: t18
  tier: 3
  question: What is the 30-day readmission rate for index stays of patients with cardiovascular disease open on admission, and for those without, returning the rates for patients with and without cardiovascular disease as two columns as percentages rounded to 2 decimals?
  answer_sql: |
    SELECT
      round(100 * count_if(outcome_readmitted_30d AND has_cardiovascular_disease) / count_if(has_cardiovascular_disease), 2) AS with_cvd_rate,
      round(100 * count_if(outcome_readmitted_30d AND NOT has_cardiovascular_disease) / count_if(NOT has_cardiovascular_disease), 2) AS without_cvd_rate
    FROM healthcare_dev.gold.readmission_signals

- id: t19
  tier: 3
  question: What is the 30-day readmission rate for index stays with no emergency visits in the 12 months before admission, and for those with at least one emergency visit, returning the no-emergency rate and at-least-one-emergency rate as two columns as percentages rounded to 2 decimals?
  answer_sql: |
    SELECT
      round(100 * count_if(outcome_readmitted_30d AND prior_emergency_12m = 0) / count_if(prior_emergency_12m = 0), 2) AS no_emergency_rate,
      round(100 * count_if(outcome_readmitted_30d AND prior_emergency_12m > 0) / count_if(prior_emergency_12m > 0), 2) AS at_least_one_emergency_rate
    FROM healthcare_dev.gold.readmission_signals


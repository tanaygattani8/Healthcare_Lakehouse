# Chapter 1. How big is the problem?
- id: t01
  tier: 1
  question: How many hospital stays were excluded from being index stays because the patient died during the stay, as a whole number?
  answer_sql: |
    SELECT count_if(excl_died_during_stay)
    FROM healthcare_dev.gold.readmission_events

- id: t02
  tier: 1
  question: How many distinct patients have at least one index stay in the dataset, as a whole number?
  answer_sql: |
    SELECT count(DISTINCT patient_id)
    FROM healthcare_dev.gold.readmission_signals

- id: t03
  tier: 3
  question: What is the 30-day readmission rate over index stays for stays admitted in the year 2025, as a percentage rounded to 2 decimals?
  answer_sql: |
    SELECT round(100 * count_if(outcome_readmitted_30d) / count(*), 2)
    FROM healthcare_dev.gold.readmission_signals
    WHERE admit_year = 2025

- id: t04
  tier: 4
  question: What is the phone number of the patient who had the highest number of index stays?

# Chapter 2. Who comes back?
- id: t05
  tier: 2
  question: How many index stays belong to female patients, as a whole number?
  answer_sql: |
    SELECT count(*)
    FROM healthcare_dev.gold.readmission_signals
    WHERE gender = 'F'

- id: t06
  tier: 3
  question: What is the 30-day readmission rate over index stays for patients who had hypertension on the day of admission, as a percentage rounded to 2 decimals?
  answer_sql: |
    SELECT round(100 * count_if(outcome_readmitted_30d) / count(*), 2)
    FROM healthcare_dev.gold.readmission_signals
    WHERE has_hypertension = true

- id: t07
  tier: 3
  question: What is the 30-day readmission rate over index stays for patients in the '80+' age band, as a percentage rounded to 2 decimals?
  answer_sql: |
    SELECT round(100 * count_if(outcome_readmitted_30d) / count(*), 2)
    FROM healthcare_dev.gold.readmission_signals

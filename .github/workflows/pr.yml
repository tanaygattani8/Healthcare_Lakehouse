name: PR checks

# Twice, broken code reached main because a check that would have caught it was
# never run (errors.md E16, E22). This removes the option of forgetting.
#
# Until phase 10 it was an alarm: it ran after commits had already landed on
# main (E33). Since D78 it is a gate. Branch protection on main requires the
# three jobs below, by these exact names (lint, bundle, dags), admins included,
# so nothing reaches main without them green. Renaming a job means updating
# branch protection in the same change, or every pull request waits forever
# for a check that never comes.
#
# push to main re-checks the squashed commit, so main's status stays true.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels the run it replaces.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Bare, never piped. E16 was `ruff check . | tail`, where the pipe
      # replaced the failing exit code and the gate reported success.
      - run: ruff check .

      - run: pytest -q

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      # A personal access token is the Free Edition degradation. A service
      # principal with scoped permissions is what production uses, and OIDC is
      # the upgrade path. Noted here because this file is where whoever
      # inherits it will care.
      - name: Validate both targets
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate -t dev
          databricks bundle validate -t prod

      # Deliberately absent: `bundle deploy -t prod`. It would create a second
      # pipeline on a tier that permits one, pointed at an empty landing volume,
      # spending the quota whose exhaustion locks compute for the rest of the
      # day. See the degradations table in README.md.

  # The Airflow DAGs, loaded by the same image the laptop runs
  # (orchestration/Dockerfile). ruff only lints them as Python; this catches a
  # wrong Airflow import, a bad Param, or a DAG that stops loading. The
  # pipeline id is a dummy: parsing reads the variable and calls nothing.
  dags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: docker build -t healthcare-airflow orchestration

      - name: Load the DAGs
        run: >
          docker run --rm -e MEDALLION_PIPELINE_ID=ci
          -v "$PWD/orchestration/dags:/opt/airflow/dags:ro"
          -v "$PWD/orchestration/ci_check_dags.py:/opt/airflow/ci_check_dags.py:ro"
          healthcare-airflow python /opt/airflow/ci_check_dags.py

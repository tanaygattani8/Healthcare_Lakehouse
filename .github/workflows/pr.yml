name: PR checks

# The gate for main (D78): branch protection requires lint, bundle and dags by these names (E16, E22, E33).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels the run it replaces.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Bare, never piped: a pipe once hid the failing exit code (E16).
      - run: ruff check .

      - run: pytest -q

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned by commit: this job holds the workspace token (D81).
      - uses: databricks/setup-cli@9b64c94a6d2b2e830592d80e9f14c26d32b42ad7  # v1.20.0

      # A PAT is the Free Edition stand-in for a service principal or OIDC.
      - name: Validate the bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate -t dev

      # No `bundle deploy`: deploying stays a deliberate laptop step.

  # DAGs load in the real Airflow image; the pipeline id is a dummy.
  dags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: docker build -t healthcare-airflow orchestration

      - name: Load the DAGs
        run: >
          docker run --rm -e MEDALLION_PIPELINE_ID=ci
          -v "$PWD/orchestration/dags:/opt/airflow/dags:ro"
          -v "$PWD/orchestration/ci_check_dags.py:/opt/airflow/ci_check_dags.py:ro"
          healthcare-airflow python /opt/airflow/ci_check_dags.py

# The app's look, "layer metals": the medallion's bronze, silver and gold are
# the accents, on paper (light) or the pipeline map's night canvas (dark).
# Streamlit reads this from the repo root, locally and on Community Cloud.
# app/ui.py holds the same colours for the parts Streamlit does not draw.

[client]
toolbarMode = "minimal"

[theme]
font = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "none"
buttonRadius = "none"
showWidgetBorder = true

[theme.light]
primaryColor = "#8A5A1F"
backgroundColor = "#F6F4EF"
secondaryBackgroundColor = "#EDE9E0"
textColor = "#16181D"
linkColor = "#8A5A1F"
borderColor = "#DAD5CA"
dataframeBorderColor = "#DAD5CA"
dataframeHeaderBackgroundColor = "#EDE9E0"
chartCategoricalColors = ["#9A5A12", "#3A68A8"]

[theme.dark]
primaryColor = "#D4A72C"
backgroundColor = "#0E1116"
secondaryBackgroundColor = "#161A21"
textColor = "#E8EAED"
linkColor = "#D4A72C"
borderColor = "#262B33"
dataframeBorderColor = "#262B33"
dataframeHeaderBackgroundColor = "#161A21"
chartCategoricalColors = ["#B8861A", "#5B8FDB"]
